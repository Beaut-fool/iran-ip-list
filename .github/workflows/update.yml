name: Update Iran IP list

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and convert
        run: |
          curl -fsSL https://raw.githubusercontent.com/herrbischoff/country-ip-blocks/master/ipv4/ir.cidr -o ir.cidr
          test $(wc -l < ir.cidr) -gt 500
          {
            echo "/ip firewall address-list"
            echo ":do { remove [find list=Iran comment=auto] } on-error={}"
            while read -r line; do
              [ -n "$line" ] && echo "add list=Iran address=$line comment=auto"
            done < ir.cidr
          } > iran.rsc

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add iran.rsc
          git diff --cached --quiet || git commit -m "update list"
          git push
